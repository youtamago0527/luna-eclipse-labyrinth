<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="月明かりに導かれ、入るたびに姿を変える迷宮へ。">
  <title>ルナの不思議なダンジョン</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="title-screen">
    <div class="moon" aria-hidden="true"></div>
    <section class="title-card" aria-labelledby="game-title">
      <p class="eyebrow">LUNA'S MYSTERY DUNGEON</p>
      <h1 id="game-title"><span>ルナの</span>不思議なダンジョン</h1>
      <p class="tagline">月明かりに導かれ、姿を変える迷宮へ。</p>
      <button id="start-button" type="button">冒険をはじめる</button>
      <p id="status" class="status" aria-live="polite">開発準備中</p>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
